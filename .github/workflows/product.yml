name: Product

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Lint, tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the product
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check cwl_grc tests
      - name: Docstrings
        run: interrogate --fail-under 100 cwl_grc
      - name: Tests and coverage
        run: pytest --cov=cwl_grc --cov-report=term-missing --cov-fail-under=100
      - name: Compile
        run: python -m compileall -q cwl_grc
