name: PostgreSQL Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgresql:
    name: PostgreSQL 18.4 lifecycle and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: grc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CWL_GRC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/grc?sslmode=disable
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Install hash-locked product
        run: uv sync --locked --extra dev
      - name: Exercise real PostgreSQL lifecycle
        run: >-
          uv run pytest -q
          tests/test_postgresql_integration.py
          tests/test_postgresql_operational_boundaries.py
          tests/test_postgresql_policy_integrity.py
      - name: Verify clean integration tree
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
