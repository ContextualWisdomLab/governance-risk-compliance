name: Buyer Workspace

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/grc-workspace/**'
      - '.storybook/**'
      - 'package.json'
      - 'tests/test_buyer_workspace_design_contract.py'
      - 'docs/adr/0012-grc-buyer-workspace-design-authority.md'
      - 'docs/product/grc-buyer-workspace-*.md'
      - '.github/workflows/buyer-workspace.yml'

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install pinned Storybook roots without mutating the tree
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Build Storybook
        run: npm run build-storybook
      - name: Verify repository remains clean
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
