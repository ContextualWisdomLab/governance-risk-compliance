name: Apply provider loader port fix once

on:
  push:
    branches:
      - feat/keyverse-oidc-provider-loader
    paths:
      - .github/workflows/apply-provider-loader-port-fix-once.yml

permissions:
  contents: write

concurrency:
  group: apply-provider-loader-port-fix-once
  cancel-in-progress: false

jobs:
  repair-test-publish:
    if: github.repository == 'ContextualWisdomLab/governance-risk-compliance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout provider-loader branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/keyverse-oidc-provider-loader
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Apply exact endpoint and transport-test repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"missing expected fragment in {path}: {old!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace(
              "cwl_grc/keyverse_provider_loader.py",
              "        port = parsed.port or 443\n",
              "        parsed_port = parsed.port\n"
              "        port = 443 if parsed_port is None else parsed_port\n",
          )
          replace(
              "tests/test_keyverse_provider_loader_edges.py",
              "    fake_context = object()\n"
              "    monkeypatch.setattr(ssl, \"create_default_context\", lambda: fake_context)\n"
              "    connection = _create_pinned_connection(\n",
              "    connection = _create_pinned_connection(\n",
          )
          replace(
              "tests/test_keyverse_provider_loader.py",
              "        (_FakeResponse(b\"{}\", content_length=\"100\"), \"too large\"),\n",
              "        (_FakeResponse(b\"{}\", content_length=\"-1\"), \"too large\"),\n"
              "        (_FakeResponse(b\"{}\", content_length=\"100\"), \"too large\"),\n",
          )
          PY
      - name: Run the complete product gate
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run ruff check cwl_grc tests
          uv run interrogate --fail-under 100 cwl_grc
          uv run pytest --cov=cwl_grc --cov-branch --cov-report=term-missing --cov-fail-under=100
          uv run python -m compileall -q cwl_grc tests
          uv lock --check
          git diff --check
      - name: Publish verified repair and remove this workflow
        env:
          BRANCH_NAME: feat/keyverse-oidc-provider-loader
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-provider-loader-port-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: close provider-loader endpoint and transport gaps"
          git push origin "HEAD:${BRANCH_NAME}"
