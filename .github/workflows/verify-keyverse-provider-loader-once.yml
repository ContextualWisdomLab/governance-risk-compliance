name: Verify Keyverse provider loader once

on:
  push:
    branches:
      - feat/keyverse-oidc-provider-loader
    paths:
      - .github/workflows/verify-keyverse-provider-loader-once.yml

permissions:
  contents: write

concurrency:
  group: verify-keyverse-provider-loader-once
  cancel-in-progress: false

jobs:
  repair-test-publish:
    if: github.repository == 'ContextualWisdomLab/governance-risk-compliance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout provider-loader branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/keyverse-oidc-provider-loader
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Replace documentation-only IPs with globally routable test fixtures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_keyverse_provider_loader.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              "192.0.2.10": "1.1.1.1",
              "198.51.100.20": "8.8.8.8",
              "2001:db8::20": "2001:4860:4860::8888",
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"missing expected fixture {old}")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY
      - name: Run the complete product gate
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run ruff check cwl_grc tests
          uv run interrogate --fail-under 100 cwl_grc
          uv run pytest --cov=cwl_grc --cov-branch --cov-report=term-missing --cov-fail-under=100
          uv run python -m compileall -q cwl_grc tests
          uv lock --check
          git diff --check
      - name: Publish verified loader and remove this workflow
        env:
          BRANCH_NAME: feat/keyverse-oidc-provider-loader
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-keyverse-provider-loader-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat: verify bounded Keyverse provider loading"
          git push origin "HEAD:${BRANCH_NAME}"
